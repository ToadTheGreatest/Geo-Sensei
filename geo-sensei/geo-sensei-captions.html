<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Geo-sensei Captions</title>
    <style>
        @font-face {
            font-family: 'rounded';
            src: url("caption-assets/Arial\ Rounded\ MT\ Bold\ Regular.woff2");
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent; /* 100% Transparent for OBS */
            font-family: 'rounded', 'Arial Black', Impact, sans-serif;
        }
        #caption-container {
            position: absolute;
            bottom: 100px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        #caption-text {
            color: white;
            font-size: 48px;
            text-align: center;
            max-width: 80%;
            padding: 15px 30px;
            background-color: rgba(0, 0, 0, 0.0); /* Semi-transparent backing box */
            border-radius: 10px;
            text-shadow: 3px 3px 0px #ffdb7f;
        }
    </style>
</head>
<body>

    <div id="caption-container">
        <div id="caption-text"></div>
    </div>

    <script>
        const captionBox = document.getElementById('caption-text');
        let clearTimer;

        // Connect to Python's WebSocket Server
        const ws = new WebSocket('ws://localhost:8765');

        ws.onmessage = (event) => {

            const data = JSON.parse(event.data);
            
            if (data.text) {
                clearTimeout(clearTimer);
                // Hide old text first

                captionBox.innerText = data.text;
                captionBox.style = `font-size: ${Math.max(48 - (data.text.length / 10)), 48}px`
            }
        };

        ws.onclose = () => {
            console.log("Disconnected from Geo-sensei backend. Retrying...");
            setTimeout(() => { location.reload(); }, 2000);
        };
    </script>
</body>
</html>
