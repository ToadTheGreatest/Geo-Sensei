<!DOCTYPE html>
<html>
    <body>
        <span>Send a message to Geo-sensei</span><br>
        <input type="text" id="prompt">
        <button onclick="send()">↑</button><br>
        <i><span style="color:#f00;" id="err"></span></i>
        <script>
            const ws = new WebSocket("ws://localhost:8768");
            connected = false;
            ws.addEventListener('open', (e) => {
                document.getElementById("err").textContent = "";
                connected = true;
            });
            window.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    send()
                }
            })
            function send() {
                if (connected) {
                    if (document.getElementById("prompt").value) {
                        ws.send(document.getElementById("prompt").value);
                        document.getElementById("err").textContent = "";
                        document.getElementById("prompt").value = "";
                } else {
                    document.getElementById("err").textContent = "ERROR: No prompt was inputted! Input a prompt.";
                }
                } else {
                    document.getElementById("err").textContent = "ERROR: WebSocket connection does not exist. Is geo-sensei running?";
                }
            }
        </script>
    </body>
</html>
